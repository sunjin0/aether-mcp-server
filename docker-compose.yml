services:
  aether-mcp:
    build: .
    # 启用 Java 委派 JWT 认证；未启用时 MCP 工具无法读取或校验工具权限。
    command: ["http", "--auth", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      # 必须与 Java 的 AETHER_MCP_DELEGATION_SECRET 一致。
      - AETHER_MCP_DELEGATION_SECRET=${AETHER_MCP_DELEGATION_SECRET:-aether-mcp-delegation-dev-secret-change-me}
      # 浏览器传来的 localhost 文件 URL 在容器内应改为 admin 服务地址。
      - AETHER_ADMIN_INTERNAL_URL=${AETHER_ADMIN_INTERNAL_URL:-http://aether-admin:8080}
      - AETHER_VISION_API_BASE_URL=${AETHER_VISION_API_BASE_URL:-}
      - AETHER_VISION_MODEL=${AETHER_VISION_MODEL:-}
      - AETHER_VISION_API_KEY=${AETHER_VISION_API_KEY:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface

  sandbox-runner:
    build:
      context: .
      dockerfile: sandbox-runner/Dockerfile
    restart: unless-stopped
    environment:
      AETHER_ADMIN_INTERNAL_URL: ${AETHER_ADMIN_INTERNAL_URL:-http://aether-admin:8080}
      AETHER_SANDBOX_RUNNER_TOKEN: ${AETHER_SANDBOX_RUNNER_TOKEN:-aether-sandbox-runner-dev-secret-change-me}
      AETHER_SANDBOX_PYTHON_IMAGE: ${AETHER_SANDBOX_PYTHON_IMAGE:-aether-sandbox-python:1}
      AETHER_SANDBOX_NODE_IMAGE: ${AETHER_SANDBOX_NODE_IMAGE:-aether-sandbox-node:1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  sandbox-runtime-python:
    image: aether-sandbox-python:1
    build:
      context: .
      dockerfile: sandbox-runtime/python.Dockerfile
    command: ["true"]

  sandbox-runtime-node:
    image: aether-sandbox-node:1
    build:
      context: .
      dockerfile: sandbox-runtime/node.Dockerfile
    command: ["true"]

volumes:
  huggingface_cache:
